name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C++ Proxy
        run: |
          cd cpp-proxy
          cmake .
          make

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd python-backend
          pip install -r requirements.txt
      - name: Start server
        run: |
          cd python-backend
          timeout 10 uvicorn app:app --port 8000 || true

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Dashboard
        run: |
          cd telemetry-dashboard
          npm install
          npm run build
